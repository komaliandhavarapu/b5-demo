<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Sky and Hills -->
    <linearGradient id="mp-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8e0ff"/>
      <stop offset="60%" stop-color="#d4f0ff"/>
      <stop offset="100%" stop-color="#fff5e6"/>
    </linearGradient>
    <linearGradient id="mp-hill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fd476"/>
      <stop offset="100%" stop-color="#6bb852"/>
    </linearGradient>
    <pattern id="mp-plaid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ffffff"/>
      <rect width="10" height="10" fill="#ff708a" opacity="0.6"/>
      <rect x="10" y="10" width="10" height="10" fill="#ff708a" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="240" height="240" fill="url(#mp-sky)"/>
  <!-- Sun & Clouds -->
  <circle cx="210" cy="40" r="24" fill="#ffe27a" opacity="0.75"/>
  <ellipse cx="60" cy="50" rx="30" ry="14" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="80" cy="45" rx="20" ry="12" fill="#ffffff" opacity="0.8"/>

  <!-- Distant Green Hills -->
  <path d="M 0,140 Q 60,110 140,130 Q 200,115 240,135 L 240,240 L 0,240 Z" fill="url(#mp-hill)"/>
  <path d="M 0,165 Q 100,150 180,160 Q 220,155 240,165 L 240,240 L 0,240 Z" fill="#5ea845"/>

  <!-- Checkered Picnic Blanket -->
  <polygon points="20,175 220,175 235,235 5,235" fill="url(#mp-plaid)"/>

  <!-- Strawberries basket & strawberries on blanket -->
  <g transform="translate(110, 195)">
    <ellipse cx="10" cy="15" rx="18" ry="12" fill="#d2985b" stroke="#a66e35" stroke-width="1.5"/>
    <circle cx="2" cy="10" r="5" fill="#f43f5e"/>
    <circle cx="10" cy="8" r="5" fill="#f43f5e"/>
    <circle cx="16" cy="11" r="5" fill="#f43f5e"/>
    <!-- Fresh strawberries beside basket -->
    <ellipse cx="-15" cy="18" rx="4.5" ry="6" fill="#f43f5e"/>
    <polygon points="-15,12 -17,10 -13,10" fill="#22c55e"/>
    <ellipse cx="32" cy="20" rx="4" ry="5.5" fill="#f43f5e"/>
  </g>

  <!-- Teddy Bear on Left of blanket -->
  <g transform="translate(48, 120)">
    <!-- Ears -->
    <circle cx="12" cy="14" r="10" fill="#f5ba75"/>
    <circle cx="12" cy="14" r="5" fill="#ffaab8"/>
    <circle cx="48" cy="14" r="10" fill="#f5ba75"/>
    <circle cx="48" cy="14" r="5" fill="#ffaab8"/>
    <!-- Party Hat -->
    <polygon points="30,-12 18,12 42,12" fill="#ffd15c"/>
    <circle cx="30,-14" r="4" fill="#ff7f9f"/>
    <!-- Body -->
    <ellipse cx="30" cy="55" rx="24" ry="22" fill="#f5ba75"/>
    <!-- Head -->
    <circle cx="30" cy="26" r="22" fill="#f5ba75"/>
    <!-- Snout & Face -->
    <ellipse cx="30" cy="32" rx="10" ry="7" fill="#fff5ea"/>
    <circle cx="30" cy="30" r="2.5" fill="#542e1d"/>
    <path d="M 28,33 Q 30,36 32,33" stroke="#542e1d" stroke-width="1.2" fill="none"/>
    <circle cx="21" cy="24" r="2.8" fill="#321b12"/>
    <circle cx="39" cy="24" r="2.8" fill="#321b12"/>
    <circle cx="16" cy="30" r="4.5" fill="#ff7b92" opacity="0.6"/>
    <circle cx="44" cy="30" r="4.5" fill="#ff7b92" opacity="0.6"/>
    <!-- Strawberry held in paw -->
    <ellipse cx="44" cy="46" rx="4" ry="5" fill="#f43f5e"/>
  </g>

  <!-- Bunny on Right of blanket -->
  <g transform="translate(138, 115)">
    <!-- Ears -->
    <ellipse cx="16" cy="2" rx="6" ry="18" fill="#ffffff"/>
    <ellipse cx="16" cy="2" rx="3.5" ry="12" fill="#ffaec5"/>
    <ellipse cx="38" cy="2" rx="6" ry="18" fill="#ffffff"/>
    <ellipse cx="38" cy="2" rx="3.5" ry="12" fill="#ffaec5"/>
    <!-- Party Hat -->
    <polygon points="27,-14 18,10 36,10" fill="#c3a2f7"/>
    <circle cx="27,-16" r="3.5" fill="#ffd15c"/>
    <!-- Body -->
    <ellipse cx="27" cy="58" rx="20" ry="18" fill="#ffffff"/>
    <!-- Head -->
    <circle cx="27" cy="30" r="20" fill="#ffffff"/>
    <!-- Snout & Face -->
    <polygon points="27,33 25,31 29,31" fill="#f585a2"/>
    <path d="M 27,33 L 27,35 M 24,35 Q 27,38 30,35" stroke="#4a2632" stroke-width="1" fill="none"/>
    <circle cx="20" cy="28" r="2.5" fill="#382129"/>
    <circle cx="34" cy="28" r="2.5" fill="#382129"/>
    <circle cx="15" cy="33" r="4.5" fill="#ff7b9a" opacity="0.6"/>
    <circle cx="39" cy="33" r="4.5" fill="#ff7b9a" opacity="0.6"/>
    <!-- Raised paw holding a strawberry -->
    <ellipse cx="14" cy="48" rx="4" ry="5" fill="#f43f5e"/>
  </g>
</svg>
