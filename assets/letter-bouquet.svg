<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="lb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#803850" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#lb-shadow)" transform="translate(10, 5) rotate(15 45 45)">
    <!-- Stems -->
    <line x1="45" y1="50" x2="38" y2="85" stroke="#718b71" stroke-width="2"/>
    <line x1="45" y1="50" x2="45" y2="88" stroke="#5a7a5a" stroke-width="2.2"/>
    <line x1="45" y1="50" x2="52" y2="84" stroke="#718b71" stroke-width="2"/>

    <!-- Kraft Paper Wrap cone -->
    <polygon points="45,80 30,45 60,45" fill="#e0caa8" stroke="#c4ab85" stroke-width="1"/>
    <!-- Twine Bow -->
    <ellipse cx="45" cy="65" rx="10" ry="3" fill="none" stroke="#9c7a52" stroke-width="1.8"/>
    <circle cx="45" cy="65" r="2.5" fill="#9c7a52"/>

    <!-- Green Leaves -->
    <ellipse cx="32" cy="40" rx="6" ry="12" transform="rotate(-30 32 40)" fill="#73a880"/>
    <ellipse cx="58" cy="40" rx="6" ry="12" transform="rotate(30 58 40)" fill="#73a880"/>

    <!-- Lavender Sprigs -->
    <line x1="40" y1="35" x2="35" y2="15" stroke="#5a7a5a" stroke-width="1.5"/>
    <circle cx="35" cy="15" r="2.5" fill="#9f7dc5"/>
    <circle cx="34" cy="20" r="2.5" fill="#8864b0"/>
    <circle cx="37" cy="25" r="2.5" fill="#8864b0"/>

    <line x1="50" y1="35" x2="55" y2="15" stroke="#5a7a5a" stroke-width="1.5"/>
    <circle cx="55" cy="15" r="2.5" fill="#9f7dc5"/>
    <circle cx="54" cy="20" r="2.5" fill="#8864b0"/>
    <circle cx="57" cy="25" r="2.5" fill="#8864b0"/>

    <!-- Pink Roses -->
    <circle cx="45" cy="38" r="10" fill="#f43f72"/>
    <circle cx="45" cy="36" r="4" fill="#ff7fa7"/>
    <circle cx="35" cy="45" r="8" fill="#ff8dae"/>
    <circle cx="35" cy="44" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="55" cy="45" r="8" fill="#ff8dae"/>
    <circle cx="55" cy="44" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Baby's breath dots -->
    <circle cx="45" cy="22" r="2" fill="#ffffff"/>
    <circle cx="28" cy="32" r="2" fill="#ffffff"/>
    <circle cx="62" cy="32" r="2" fill="#ffffff"/>
  </g>
</svg>
