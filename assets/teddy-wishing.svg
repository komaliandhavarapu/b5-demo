<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <radialGradient id="twi-fur" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fedcb0"/>
      <stop offset="50%" stop-color="#f5ba75"/>
      <stop offset="85%" stop-color="#e29b4c"/>
      <stop offset="100%" stop-color="#c67e33"/>
    </radialGradient>
    <radialGradient id="twi-snout" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff5ea"/>
      <stop offset="80%" stop-color="#fce2c5"/>
      <stop offset="100%" stop-color="#f0caa2"/>
    </radialGradient>
    <radialGradient id="twi-ear-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaab8"/>
      <stop offset="100%" stop-color="#e97b91"/>
    </radialGradient>
    <radialGradient id="twi-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b92" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff7b92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="twi-hat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ab5"/>
      <stop offset="40%" stop-color="#ffd56b"/>
      <stop offset="70%" stop-color="#7fe0cc"/>
      <stop offset="100%" stop-color="#b69efa"/>
    </linearGradient>
    <filter id="twi-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#803818" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#twi-shadow)">
    <!-- Ears -->
    <circle cx="56" cy="74" r="23" fill="url(#twi-fur)"/>
    <circle cx="56" cy="74" r="13" fill="url(#twi-ear-inner)"/>
    
    <circle cx="144" cy="74" r="23" fill="url(#twi-fur)"/>
    <circle cx="144" cy="74" r="13" fill="url(#twi-ear-inner)"/>

    <!-- Chubby Body Sitting -->
    <ellipse cx="100" cy="178" rx="54" ry="46" fill="url(#twi-fur)"/>
    <ellipse cx="100" cy="180" rx="36" ry="30" fill="url(#twi-snout)" opacity="0.85"/>

    <!-- Paws / Feet sitting forward -->
    <ellipse cx="64" cy="216" rx="20" ry="16" fill="url(#twi-fur)"/>
    <circle cx="64" cy="216" r="10" fill="url(#twi-ear-inner)" opacity="0.6"/>
    <ellipse cx="136" cy="216" rx="20" ry="16" fill="url(#twi-fur)"/>
    <circle cx="136" cy="216" r="10" fill="url(#twi-ear-inner)" opacity="0.6"/>

    <!-- Head -->
    <circle cx="100" cy="106" r="52" fill="url(#twi-fur)"/>

    <!-- Party Hat -->
    <polygon points="100,20 76,76 124,76" fill="url(#twi-hat)"/>
    <path d="M 80,66 Q 100,70 120,66 L 123,73 Q 100,77 77,73 Z" fill="#ffd15c" opacity="0.9"/>
    <path d="M 86,51 Q 100,54 114,51 L 117,57 Q 100,60 83,57 Z" fill="#ff7f9f" opacity="0.9"/>
    <path d="M 92,36 Q 100,38 108,36 L 110,42 Q 100,44 90,42 Z" fill="#6ad5bf" opacity="0.9"/>
    <circle cx="100" cy="19" r="9" fill="#fff" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.15))"/>
    <circle cx="100" cy="19" r="6" fill="#ffe28a"/>
    <!-- Daisy flower on hat brim -->
    <circle cx="78" cy="76" r="6" fill="#ffbcd2"/>
    <circle cx="78" cy="76" r="3" fill="#ffe28a"/>

    <!-- Snout -->
    <ellipse cx="100" cy="118" rx="24" ry="18" fill="url(#twi-snout)"/>
    <!-- Nose -->
    <path d="M 94,110 C 94,107 106,107 106,110 C 106,115 101,118 100,118 C 99,118 94,115 94,110 Z" fill="#542e1d"/>
    <ellipse cx="98" cy="109" rx="2.5" ry="1.2" fill="#fff" opacity="0.7"/>
    <!-- Peaceful gentle smiling mouth -->
    <path d="M 100,118 L 100,121 M 94,121 Q 100,126 106,121" stroke="#542e1d" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes Closed in Prayer / Wish (Curved Peaceful Lashes) -->
    <path d="M 72,100 Q 80,108 88,100" stroke="#422517" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M 112,100 Q 120,108 128,100" stroke="#422517" stroke-width="3.2" stroke-linecap="round" fill="none"/>

    <!-- Rosy Blushing Cheeks -->
    <circle cx="68" cy="114" r="13" fill="url(#twi-blush)"/>
    <circle cx="132" cy="114" r="13" fill="url(#twi-blush)"/>

    <!-- Clasped Wishing Paws under chin -->
    <g transform="translate(100, 148)">
      <!-- Left Paw -->
      <ellipse cx="-12" cy="0" rx="14" ry="18" transform="rotate(30 -12 0)" fill="url(#twi-fur)"/>
      <!-- Right Paw -->
      <ellipse cx="12" cy="0" rx="14" ry="18" transform="rotate(-30 12 0)" fill="url(#twi-fur)"/>
      <!-- Clasped Fingers touch point -->
      <ellipse cx="0" cy="-2" rx="10" ry="12" fill="url(#twi-fur)"/>
      <ellipse cx="0" cy="-2" rx="6" ry="7" fill="url(#twi-ear-inner)" opacity="0.35"/>
    </g>
  </g>
</svg>
