<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <!-- Delicate painted watercolor flowers for envelope flaps -->
  <g>
    <!-- Stems -->
    <path d="M 50,110 Q 42,65 30,30" stroke="#7da186" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 45,75 Q 58,55 65,35" stroke="#7da186" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <path d="M 46,90 Q 30,85 36,78 Q 44,82 46,90 Z" fill="#88b593" opacity="0.85"/>
    <path d="M 48,70 Q 60,65 56,58 Q 48,62 48,70 Z" fill="#88b593" opacity="0.85"/>
    <path d="M 38,50 Q 24,46 30,40 Q 38,44 38,50 Z" fill="#9ec9a8" opacity="0.85"/>

    <!-- Lavender bud sprig on left stem -->
    <circle cx="28" cy="25" r="3" fill="#9c7ec7"/>
    <circle cx="25" cy="30" r="3" fill="#8868b4"/>
    <circle cx="31" cy="32" r="3" fill="#8868b4"/>
    <circle cx="27" cy="38" r="3.2" fill="#7856a4"/>
    <circle cx="33" cy="40" r="3.2" fill="#7856a4"/>

    <!-- Pink Wildflower on right branch -->
    <g transform="translate(65, 35)">
      <!-- Petals -->
      <circle cx="0" cy="-6" r="5" fill="#fca5ba" opacity="0.9"/>
      <circle cx="-6" cy="-2" r="5" fill="#fc95ad" opacity="0.9"/>
      <circle cx="6" cy="-2" r="5" fill="#fc95ad" opacity="0.9"/>
      <circle cx="-4" cy="5" r="5" fill="#f784a0" opacity="0.9"/>
      <circle cx="4" cy="5" r="5" fill="#f784a0" opacity="0.9"/>
      <!-- Flower center -->
      <circle cx="0" cy="0" r="3.5" fill="#ffe17d"/>
      <circle cx="0" cy="0" r="1.5" fill="#d97706"/>
    </g>

    <!-- Tiny pink bud lower down -->
    <circle cx="48" cy="80" r="3.5" fill="#fca5ba"/>
    <circle cx="48" cy="80" r="1.5" fill="#fff"/>
  </g>
</svg>
