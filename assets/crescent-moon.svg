<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="cm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffe68a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cm-moon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff5cc"/>
      <stop offset="85%" stop-color="#fde07a"/>
      <stop offset="100%" stop-color="#f5c742"/>
    </radialGradient>
    <filter id="cm-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fde07a" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Moon Glow -->
  <circle cx="60" cy="60" r="56" fill="url(#cm-glow)"/>

  <!-- Crescent Moon -->
  <path d="M 68,22 C 86,30 96,48 94,68 C 92,86 78,100 60,102 C 78,96 86,80 84,64 C 82,48 74,32 68,22 Z" fill="url(#cm-moon)" filter="url(#cm-blur)"/>
  <!-- Highlight rim -->
  <path d="M 72,25 C 88,34 94,50 92,68 C 90,84 78,96 64,100" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.8"/>

  <!-- Tiny sparkle nearby -->
  <g transform="translate(38, 30)">
    <path d="M 0, -6 Q 0, 0 6, 0 Q 0, 0 0, 6 Q 0, 0 -6, 0 Q 0, 0 0, -6 Z" fill="#fff" opacity="0.85"/>
  </g>
  <g transform="translate(48, 75)">
    <path d="M 0, -4 Q 0, 0 4, 0 Q 0, 0 0, 4 Q 0, 0 -4, 0 Q 0, 0 0, -4 Z" fill="#ffe28a" opacity="0.75"/>
  </g>
</svg>
