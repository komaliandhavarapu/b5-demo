<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 230" width="100%" height="100%">
  <defs>
    <radialGradient id="bn-fur" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fff4f7"/>
      <stop offset="90%" stop-color="#f8e1ea"/>
      <stop offset="100%" stop-color="#ebd0db"/>
    </radialGradient>
    <radialGradient id="bn-ear-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb8cc"/>
      <stop offset="100%" stop-color="#f48ea8"/>
    </radialGradient>
    <radialGradient id="bn-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b9a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff7b9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bn-hat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4a5f8"/>
      <stop offset="50%" stop-color="#ff9ec1"/>
      <stop offset="100%" stop-color="#ffd56b"/>
    </linearGradient>
    <filter id="bn-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#804a60" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#bn-shadow)">
    <!-- Ears -->
    <!-- Left Ear -->
    <g transform="rotate(-18 62 70)">
      <ellipse cx="62" cy="45" rx="16" ry="42" fill="url(#bn-fur)"/>
      <ellipse cx="62" cy="46" rx="9" ry="30" fill="url(#bn-ear-inner)"/>
    </g>
    <!-- Right Ear -->
    <g transform="rotate(18 118 70)">
      <ellipse cx="118" cy="45" rx="16" ry="42" fill="url(#bn-fur)"/>
      <ellipse cx="118" cy="46" rx="9" ry="30" fill="url(#bn-ear-inner)"/>
    </g>

    <!-- Body -->
    <ellipse cx="90" cy="180" rx="46" ry="42" fill="url(#bn-fur)"/>
    <ellipse cx="90" cy="182" rx="28" ry="26" fill="#ffffff" opacity="0.9"/>

    <!-- Bottom paws -->
    <ellipse cx="65" cy="214" rx="15" ry="11" fill="url(#bn-fur)"/>
    <ellipse cx="115" cy="214" rx="15" ry="11" fill="url(#bn-fur)"/>

    <!-- Head -->
    <circle cx="90" cy="118" r="48" fill="url(#bn-fur)"/>

    <!-- Party Hat -->
    <polygon points="90,48 70,95 110,95" fill="url(#bn-hat)"/>
    <path d="M 73,86 Q 90,89 107,86 L 109,92 Q 90,95 71,92 Z" fill="#ffd15c" opacity="0.9"/>
    <path d="M 78,74 Q 90,77 102,74 L 104,79 Q 90,82 76,79 Z" fill="#ff7f9f" opacity="0.9"/>
    <!-- Pom-pom -->
    <circle cx="90" cy="47" r="8" fill="#fff" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.15))"/>
    <circle cx="90" cy="47" r="5" fill="#fbd1df"/>

    <!-- Eyes -->
    <circle cx="72" cy="115" r="5.5" fill="#382129"/>
    <circle cx="70.5" cy="113" r="2.2" fill="#ffffff"/>
    <circle cx="74" cy="116.5" r="1" fill="#ffffff"/>
    
    <circle cx="108" cy="115" r="5.5" fill="#382129"/>
    <circle cx="106.5" cy="113" r="2.2" fill="#ffffff"/>
    <circle cx="110" cy="116.5" r="1" fill="#ffffff"/>

    <!-- Cheeks blush -->
    <circle cx="64" cy="125" r="12" fill="url(#bn-blush)"/>
    <circle cx="116" cy="125" r="12" fill="url(#bn-blush)"/>

    <!-- Nose & Mouth -->
    <polygon points="90,123 86,120 94,120" fill="#f585a2"/>
    <path d="M 90,123 L 90,127 M 84,127 Q 90,132 96,127" stroke="#4a2632" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Cute raised paws -->
    <!-- Left Paw raising -->
    <ellipse cx="50" cy="155" rx="12" ry="16" transform="rotate(-30 50 155)" fill="url(#bn-fur)"/>
    <ellipse cx="50" cy="155" rx="7" ry="10" transform="rotate(-30 50 155)" fill="url(#bn-ear-inner)" opacity="0.4"/>
    <!-- Right Paw raising -->
    <ellipse cx="130" cy="155" rx="12" ry="16" transform="rotate(30 130 155)" fill="url(#bn-fur)"/>
    <ellipse cx="130" cy="155" rx="7" ry="10" transform="rotate(30 130 155)" fill="url(#bn-ear-inner)" opacity="0.4"/>
  </g>
</svg>
