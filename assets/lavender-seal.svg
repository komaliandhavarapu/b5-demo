<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <!-- Wax Seal 3D Gradients -->
    <radialGradient id="ws-body" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff759f"/>
      <stop offset="45%" stop-color="#f23d77"/>
      <stop offset="85%" stop-color="#cc1654"/>
      <stop offset="100%" stop-color="#8f0834"/>
    </radialGradient>
    <radialGradient id="ws-inner" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff8fae"/>
      <stop offset="50%" stop-color="#ec4477"/>
      <stop offset="100%" stop-color="#b51244"/>
    </radialGradient>
    <!-- Lilac Satin Ribbon -->
    <linearGradient id="ls-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ded0f8"/>
      <stop offset="35%" stop-color="#c4acf0"/>
      <stop offset="70%" stop-color="#a484e0"/>
      <stop offset="100%" stop-color="#7a55c2"/>
    </linearGradient>
    <filter id="ls-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4a1830" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#ls-shadow)">
    <!-- DRIED BOUQUET TUCKED UNDER RIBBON -->
    <!-- Stems extending down past ribbon knot -->
    <g stroke="#557555" stroke-width="2" stroke-linecap="round">
      <line x1="140" y1="140" x2="132" y2="195"/>
      <line x1="140" y1="140" x2="140" y2="202"/>
      <line x1="140" y1="140" x2="148" y2="195"/>
    </g>

    <!-- Golden Wheat Stalks (Left & Right) -->
    <!-- Left Wheat -->
    <g transform="translate(112, 10) rotate(-16 10 90)">
      <line x1="12" y1="120" x2="12" y2="15" stroke="#be9852" stroke-width="2.2"/>
      <ellipse cx="6" cy="18" rx="3.5" ry="7" transform="rotate(-30 6 18)" fill="#e5c485"/>
      <ellipse cx="18" cy="18" rx="3.5" ry="7" transform="rotate(30 18 18)" fill="#e5c485"/>
      <ellipse cx="6" cy="30" rx="3.5" ry="7" transform="rotate(-30 6 30)" fill="#dcb873"/>
      <ellipse cx="18" cy="30" rx="3.5" ry="7" transform="rotate(30 18 30)" fill="#dcb873"/>
      <ellipse cx="6" cy="42" rx="3.5" ry="7" transform="rotate(-30 6 42)" fill="#d4ad64"/>
      <ellipse cx="18" cy="42" rx="3.5" ry="7" transform="rotate(30 18 42)" fill="#d4ad64"/>
      <ellipse cx="6" cy="54" rx="3.5" ry="7" transform="rotate(-30 6 54)" fill="#c99f52"/>
      <ellipse cx="18" cy="54" rx="3.5" ry="7" transform="rotate(30 18 54)" fill="#c99f52"/>
      <circle cx="12" cy="10" r="3" fill="#f0d59e"/>
    </g>

    <!-- Right Wheat -->
    <g transform="translate(144, 10) rotate(16 10 90)">
      <line x1="12" y1="120" x2="12" y2="15" stroke="#be9852" stroke-width="2.2"/>
      <ellipse cx="6" cy="18" rx="3.5" ry="7" transform="rotate(-30 6 18)" fill="#e5c485"/>
      <ellipse cx="18" cy="18" rx="3.5" ry="7" transform="rotate(30 18 18)" fill="#e5c485"/>
      <ellipse cx="6" cy="30" rx="3.5" ry="7" transform="rotate(-30 6 30)" fill="#dcb873"/>
      <ellipse cx="18" cy="30" rx="3.5" ry="7" transform="rotate(30 18 30)" fill="#dcb873"/>
      <ellipse cx="6" cy="42" rx="3.5" ry="7" transform="rotate(-30 6 42)" fill="#d4ad64"/>
      <ellipse cx="18" cy="42" rx="3.5" ry="7" transform="rotate(30 18 42)" fill="#d4ad64"/>
      <ellipse cx="6" cy="54" rx="3.5" ry="7" transform="rotate(-30 6 54)" fill="#c99f52"/>
      <ellipse cx="18" cy="54" rx="3.5" ry="7" transform="rotate(30 18 54)" fill="#c99f52"/>
      <circle cx="12" cy="10" r="3" fill="#f0d59e"/>
    </g>

    <!-- Lavender Stalk (Center) -->
    <g transform="translate(126, 5)">
      <line x1="14" y1="130" x2="14" y2="10" stroke="#486e4e" stroke-width="2.5"/>
      <!-- Flower buds -->
      <circle cx="9" cy="14" r="4" fill="#a781d8"/>
      <circle cx="19" cy="14" r="4" fill="#a781d8"/>
      <circle cx="14" cy="8" r="4" fill="#c3a5ea"/>
      
      <circle cx="8" cy="26" rx="4" ry="4.5" fill="#956bcc"/>
      <circle cx="20" cy="26" rx="4" ry="4.5" fill="#956bcc"/>
      <circle cx="14" cy="20" rx="4" ry="4.5" fill="#af8ae0"/>

      <circle cx="7" cy="38" rx="4.5" ry="5" fill="#8454be"/>
      <circle cx="21" cy="38" rx="4.5" ry="5" fill="#8454be"/>
      <circle cx="14" cy="32" rx="4.5" ry="5" fill="#9a6fd4"/>

      <circle cx="6" cy="50" rx="4.8" ry="5.5" fill="#7543b3"/>
      <circle cx="22" cy="50" rx="4.8" ry="5.5" fill="#7543b3"/>
      <circle cx="14" cy="45" rx="4.8" ry="5.5" fill="#8b5fc9"/>

      <circle cx="5" cy="64" rx="5" ry="6" fill="#6735a5"/>
      <circle cx="23" cy="64" rx="5" ry="6" fill="#6735a5"/>
      <circle cx="14" cy="58" rx="5" ry="6" fill="#7d4bbb"/>
    </g>

    <!-- Baby's breath sprinkles -->
    <circle cx="114" cy="70" r="3.5" fill="#fff" opacity="0.95"/>
    <circle cx="122" cy="52" r="3" fill="#fff" opacity="0.95"/>
    <circle cx="158" cy="54" r="3" fill="#fff" opacity="0.95"/>
    <circle cx="166" cy="72" r="3.5" fill="#fff" opacity="0.95"/>

    <!-- LILAC SATIN RIBBON BOW -->
    <!-- Ribbon tails flowing down gracefully -->
    <!-- Left Tail -->
    <path d="M 132,140 Q 105,175 102,220 Q 115,220 126,192 Q 134,168 138,144 Z" fill="url(#ls-ribbon)"/>
    <!-- Right Tail -->
    <path d="M 148,140 Q 175,175 178,220 Q 165,220 154,192 Q 146,168 142,144 Z" fill="url(#ls-ribbon)"/>

    <!-- Left Loop -->
    <path d="M 140,138 C 85,102 65,158 130,146 Z" fill="url(#ls-ribbon)"/>
    <path d="M 138,138 C 94,112 80,148 128,144 Z" fill="#d9c7f8"/>
    <!-- Right Loop -->
    <path d="M 140,138 C 195,102 215,158 150,146 Z" fill="url(#ls-ribbon)"/>
    <path d="M 142,138 C 186,112 200,148 152,144 Z" fill="#d9c7f8"/>

    <!-- Ribbon Knot Backing -->
    <circle cx="140" cy="140" r="16" fill="#885fc7"/>

    <!-- 3D EMBOSSED PINK HEART WAX SEAL -->
    <!-- Organic wax puddle edge -->
    <path d="M 140,112 C 154,110 168,114 173,126 C 178,138 175,152 168,162 C 161,171 149,178 140,180 C 131,178 119,171 112,162 C 105,152 102,138 107,126 C 112,114 126,110 140,112 Z" fill="url(#ws-body)"/>
    
    <!-- Outer wax rim highlight -->
    <path d="M 140,115 C 152,113 164,117 168,128 C 172,137 170,148 164,156 C 158,164 148,170 140,172 C 132,170 122,164 116,156 C 110,148 108,137 112,128 C 116,117 128,113 140,115 Z" fill="none" stroke="#ffa3bc" stroke-width="2.2" opacity="0.8"/>

    <!-- Raised Wax Heart Shape -->
    <path d="M 140,130 C 140,121 127,117 124,127 C 120,136 131,146 140,156 C 149,146 160,136 156,127 C 153,117 140,121 140,130 Z" fill="url(#ws-inner)"/>

    <!-- Inner Embossed Heart -->
    <path d="M 140,134 C 140,127 130,124 127,131 C 125,138 133,145 140,152 C 147,145 155,138 153,131 C 150,124 140,127 140,134 Z" fill="none" stroke="#ffe0e8" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Glossy Specular Reflection -->
    <ellipse cx="131" cy="122" rx="7" ry="4" transform="rotate(-25 131 122)" fill="#ffffff" opacity="0.8"/>
    <circle cx="124" cy="125" r="2" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
