<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Cozy Kitchen Background -->
    <linearGradient id="mb-kitchen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="60%" stop-color="#fcedd7"/>
      <stop offset="100%" stop-color="#f5dcbe"/>
    </linearGradient>
    <linearGradient id="mb-counter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9a373"/>
      <stop offset="100%" stop-color="#b88052"/>
    </linearGradient>
  </defs>

  <!-- Cozy Kitchen Wall -->
  <rect width="240" height="240" fill="url(#mb-kitchen)"/>
  <!-- Shelf with spice jars -->
  <rect x="20" y="45" width="200" height="8" rx="2" fill="#d9a373"/>
  <rect x="40" y="28" width="12" height="17" rx="2" fill="#ffb4cf"/>
  <rect x="60" y="24" width="14" height="21" rx="2" fill="#75d6be"/>
  <rect x="165" y="30" width="16" height="15" rx="2" fill="#ffe28a"/>
  <rect x="190" y="25" width="15" height="20" rx="2" fill="#c3a2f7"/>

  <!-- Kitchen Counter -->
  <rect x="0" y="155" width="240" height="85" fill="url(#mb-counter)"/>
  <rect x="0" y="155" width="240" height="12" fill="#e8ba8d"/>

  <!-- Cupcakes and Rolling pin on counter -->
  <!-- Rolling Pin -->
  <rect x="25" y="195" width="55" height="10" rx="4" transform="rotate(-15 25 195)" fill="#e5b882"/>
  <rect x="18" y="194" width="8" height="4" rx="2" transform="rotate(-15 18 194)" fill="#b37f48"/>
  <rect x="78" y="178" width="8" height="4" rx="2" transform="rotate(-15 78 178)" fill="#b37f48"/>

  <!-- Cupcakes on Right -->
  <g transform="translate(180, 185)">
    <!-- Cupcake 1 -->
    <polygon points="5,20 20,20 18,32 7,32" fill="#d98299"/>
    <ellipse cx="12" cy="18" rx="9" ry="8" fill="#ffbcd2"/>
    <circle cx="12" cy="11" r="3" fill="#e11d48"/>
    <!-- Cupcake 2 -->
    <polygon points="26,22 41,22 39,34 28,34" fill="#69beaa"/>
    <ellipse cx="33" cy="20" rx="9" ry="8" fill="#fef08a"/>
    <circle cx="33" cy="13" r="3" fill="#e11d48"/>
  </g>

  <!-- Big Pink Mixing Bowl in Center -->
  <g transform="translate(95, 140)">
    <ellipse cx="25" cy="45" rx="32" ry="24" fill="#f43f7a"/>
    <ellipse cx="25" cy="32" rx="30" ry="12" fill="#ffffff" stroke="#f43f7a" stroke-width="2"/>
    <ellipse cx="25" cy="33" rx="26" ry="9" fill="#ffeb99"/>
    <!-- Wooden Spoon -->
    <line x1="25" y1="33" x2="35" y2="2" stroke="#b37f48" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="37" cy="2" rx="5" ry="7" transform="rotate(-20 37 2)" fill="#c99763"/>
  </g>

  <!-- Teddy Bear on Left stirring bowl -->
  <g transform="translate(35, 75)">
    <!-- Ears -->
    <circle cx="14" cy="18" r="9" fill="#f5ba75"/>
    <circle cx="50" cy="18" r="9" fill="#f5ba75"/>
    <!-- Party Hat -->
    <polygon points="32,-10 20,15 44,15" fill="#ffd15c"/>
    <circle cx="32,-12" r="4" fill="#ff7f9f"/>
    <!-- Body in Apron -->
    <ellipse cx="32" cy="65" rx="26" ry="24" fill="#f5ba75"/>
    <!-- Cute Pink Apron -->
    <path d="M 20,55 L 44,55 L 48,85 L 16,85 Z" fill="#ff8dae"/>
    <line x1="20" y1="55" x2="16" y2="45" stroke="#ff8dae" stroke-width="2"/>
    <line x1="44" y1="55" x2="48" y2="45" stroke="#ff8dae" stroke-width="2"/>
    <!-- Head -->
    <circle cx="32" cy="30" r="23" fill="#f5ba75"/>
    <ellipse cx="32" cy="36" rx="10" ry="7" fill="#fff5ea"/>
    <circle cx="32" cy="34" r="2.5" fill="#542e1d"/>
    <circle cx="23" cy="27" r="3" fill="#321b12"/>
    <circle cx="41" cy="27" r="3" fill="#321b12"/>
    <circle cx="17" cy="34" r="5" fill="#ff7b92" opacity="0.6"/>
    <circle cx="47" cy="34" r="5" fill="#ff7b92" opacity="0.6"/>
    <!-- Flour dab on teddy's nose -->
    <circle cx="32" cy="32" r="2" fill="#ffffff" opacity="0.9"/>
    <!-- Paws holding the bowl -->
    <ellipse cx="56" cy="72" rx="7" ry="6" fill="#f5ba75"/>
  </g>

  <!-- Bunny on Right mixing with spoon -->
  <g transform="translate(132, 70)">
    <!-- Ears -->
    <ellipse cx="18" cy="4" rx="6" ry="20" fill="#ffffff"/>
    <ellipse cx="18" cy="4" rx="3.5" ry="14" fill="#ffaec5"/>
    <ellipse cx="40" cy="4" rx="6" ry="20" fill="#ffffff"/>
    <ellipse cx="40" cy="4" rx="3.5" ry="14" fill="#ffaec5"/>
    <!-- Party Hat -->
    <polygon points="29,-12 20,12 38,12" fill="#c3a2f7"/>
    <!-- Body in Apron -->
    <ellipse cx="29" cy="68" rx="22" ry="22" fill="#ffffff"/>
    <!-- Mint Apron -->
    <path d="M 18,58 L 40,58 L 44,86 L 14,86 Z" fill="#75d6be"/>
    <!-- Head -->
    <circle cx="29" cy="34" r="21" fill="#ffffff"/>
    <polygon points="29,37 27,35 31,35" fill="#f585a2"/>
    <circle cx="21" cy="32" r="2.5" fill="#382129"/>
    <circle cx="37" cy="32" r="2.5" fill="#382129"/>
    <circle cx="15" cy="37" r="4.5" fill="#ff7b9a" opacity="0.6"/>
    <circle cx="43" cy="37" r="4.5" fill="#ff7b9a" opacity="0.6"/>
    <!-- Flour dab on bunny cheek -->
    <circle cx="38" cy="36" r="2.5" fill="#ffffff"/>
    <!-- Paws holding the spoon -->
    <ellipse cx="2" cy="70" rx="7" ry="6" fill="#ffffff"/>
  </g>
</svg>
