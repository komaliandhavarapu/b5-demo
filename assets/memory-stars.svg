<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Midnight Sky -->
    <linearGradient id="ms-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0a24"/>
      <stop offset="60%" stop-color="#211545"/>
      <stop offset="100%" stop-color="#462c70"/>
    </linearGradient>
    <linearGradient id="ms-hill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a4530"/>
      <stop offset="100%" stop-color="#142618"/>
    </linearGradient>
    <linearGradient id="ms-streak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffe999"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Starry Sky -->
  <rect width="240" height="240" fill="url(#ms-sky)"/>

  <!-- Shooting Star Streaking Across -->
  <g transform="translate(140, 25)">
    <line x1="35" y1="5" x2="-20" y2="45" stroke="url(#ms-streak)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="35" cy="5" r="3.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ffe999)"/>
  </g>

  <!-- Twinkling Stars -->
  <circle cx="45" cy="40" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="90" cy="25" r="2" fill="#ffd15c" opacity="0.95"/>
  <circle cx="120" cy="55" r="1.2" fill="#ffffff" opacity="0.75"/>
  <circle cx="30" cy="80" r="1.8" fill="#ffd15c" opacity="0.8"/>
  <circle cx="75" cy="70" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="195" cy="65" r="2.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="170" cy="90" r="1.5" fill="#ffd15c" opacity="0.85"/>
  <circle cx="215" cy="35" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Star Sparkles -->
  <path d="M 90,25 Q 90,29 94,29 Q 90,29 90,33 Q 90,29 86,29 Q 90,29 90,25 Z" fill="#ffd15c"/>
  <path d="M 195,65 Q 195,68 198,68 Q 195,68 195,71 Q 195,68 192,68 Q 195,68 195,65 Z" fill="#ffffff"/>

  <!-- Grassy Hill Under Stars -->
  <ellipse cx="120" cy="235" rx="150" ry="60" fill="url(#ms-hill)"/>

  <!-- Teddy Bear Lying on Back Looking Up -->
  <g transform="translate(75, 140)">
    <!-- Ears -->
    <circle cx="12" cy="18" r="8" fill="#f5ba75"/>
    <circle cx="48" cy="18" r="8" fill="#f5ba75"/>
    <!-- Party Hat tilted -->
    <polygon points="30,-5 20,15 40,15" fill="#ffd15c"/>
    <circle cx="30,-7" r="3.5" fill="#ff7f9f"/>
    <!-- Body lying back -->
    <ellipse cx="30" cy="46" rx="22" ry="18" fill="#f5ba75"/>
    <ellipse cx="30" cy="46" rx="14" ry="11" fill="#fff5ea" opacity="0.85"/>
    <!-- Head tilted up -->
    <circle cx="30" cy="24" r="18" fill="#f5ba75"/>
    <ellipse cx="30" cy="20" rx="9" ry="6" fill="#fff5ea"/>
    <circle cx="30" cy="18" r="2" fill="#542e1d"/>
    <circle cx="23" cy="22" r="2.2" fill="#321b12"/>
    <circle cx="37" cy="22" r="2.2" fill="#321b12"/>
    <circle cx="18" cy="26" r="3.5" fill="#ff7b92" opacity="0.6"/>
    <circle cx="42" cy="26" r="3.5" fill="#ff7b92" opacity="0.6"/>
    <!-- Paw pointing straight up to shooting star -->
    <ellipse cx="44" cy="10" rx="4.5" ry="9" transform="rotate(25 44 10)" fill="#f5ba75"/>
    <!-- Other paw resting on belly -->
    <ellipse cx="16" cy="42" rx="6" ry="5" fill="#f5ba75"/>
    <!-- Feet sticking up -->
    <ellipse cx="18" cy="62" rx="7" ry="5" fill="#f5ba75"/>
    <ellipse cx="42" cy="62" rx="7" ry="5" fill="#f5ba75"/>
  </g>

  <!-- Bunny Lying Beside Teddy Gazing Up -->
  <g transform="translate(132, 145)">
    <!-- Ears resting back in grass -->
    <ellipse cx="12" cy="10" rx="5" ry="15" transform="rotate(-30 12 10)" fill="#ffffff"/>
    <ellipse cx="12" cy="10" rx="3" ry="10" transform="rotate(-30 12 10)" fill="#ffaec5"/>
    <ellipse cx="34" cy="10" rx="5" ry="15" transform="rotate(30 34 10)" fill="#ffffff"/>
    <ellipse cx="34" cy="10" rx="3" ry="10" transform="rotate(30 34 10)" fill="#ffaec5"/>
    <!-- Party Hat -->
    <polygon points="23,-2 15,14 31,14" fill="#c3a2f7"/>
    <!-- Body -->
    <ellipse cx="23" cy="45" rx="17" ry="15" fill="#ffffff"/>
    <!-- Head -->
    <circle cx="23" cy="22" r="16" fill="#ffffff"/>
    <polygon points="23,20 21,18 25,18" fill="#f585a2"/>
    <circle cx="17" cy="21" r="2" fill="#382129"/>
    <circle cx="29" cy="21" r="2" fill="#382129"/>
    <circle cx="13" cy="25" r="3.5" fill="#ff7b9a" opacity="0.6"/>
    <circle cx="33" cy="25" r="3.5" fill="#ff7b9a" opacity="0.6"/>
    <!-- Paws folded on chest -->
    <ellipse cx="18" cy="38" rx="4.5" ry="5" fill="#ffffff"/>
    <ellipse cx="28" cy="38" rx="4.5" ry="5" fill="#ffffff"/>
    <!-- Feet -->
    <ellipse cx="14" cy="58" rx="5.5" ry="4" fill="#ffffff"/>
    <ellipse cx="32" cy="58" rx="5.5" ry="4" fill="#ffffff"/>
  </g>
</svg>
