<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Sunset Sky -->
    <linearGradient id="mbl-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c2668"/>
      <stop offset="35%" stop-color="#8d3d75"/>
      <stop offset="70%" stop-color="#e86b72"/>
      <stop offset="100%" stop-color="#ffd56b"/>
    </linearGradient>
  </defs>

  <!-- Sunset Sky -->
  <rect width="240" height="240" fill="url(#mbl-sky)"/>

  <!-- Distant Carnival Lights & Ferris Wheel below -->
  <circle cx="50" cy="220" r="40" fill="none" stroke="#ffe28a" stroke-width="2" stroke-dasharray="4,6" opacity="0.6"/>
  <circle cx="190" cy="225" r="30" fill="none" stroke="#ffb4cf" stroke-width="2" stroke-dasharray="3,5" opacity="0.6"/>
  <!-- Carnival tent silhouettes -->
  <polygon points="110,240 125,200 140,240" fill="#58214d" opacity="0.8"/>
  <polygon points="85,240 95,210 105,240" fill="#58214d" opacity="0.8"/>
  <!-- Tiny twinkling carnival lights -->
  <circle cx="95" cy="210" r="2" fill="#ffd15c"/>
  <circle cx="125" cy="200" r="2" fill="#ff7f9f"/>
  <circle cx="155" cy="215" r="2" fill="#6ee7b7"/>

  <!-- Magical Sunset Clouds -->
  <ellipse cx="60" cy="140" rx="45" ry="14" fill="#ffa8b6" opacity="0.5"/>
  <ellipse cx="180" cy="155" rx="55" ry="16" fill="#fbcfe8" opacity="0.5"/>

  <!-- Hot Air Balloon Basket / Ferris Wheel Carriage in foreground -->
  <g transform="translate(60, 90)">
    <!-- Hot Air Balloon Rigging / Canopy Roof -->
    <path d="M 10,20 Q 60,-15 110,20" stroke="#f472b6" stroke-width="4" fill="none"/>
    <line x1="20" y1="20" x2="20" y2="70" stroke="#ffd15c" stroke-width="2.5"/>
    <line x1="100" y1="20" x2="100" y2="70" stroke="#ffd15c" stroke-width="2.5"/>
    <!-- Balloon decorative canopy flags -->
    <polygon points="30,16 45,18 37,28" fill="#a78bfa"/>
    <polygon points="50,14 65,14 57,26" fill="#f43f5e"/>
    <polygon points="70,16 85,18 77,28" fill="#34d399"/>

    <!-- Teddy and Bunny inside the carriage leaning on the railing -->
    <!-- Teddy on Left -->
    <g transform="translate(18, 25)">
      <circle cx="12" cy="16" r="7.5" fill="#f5ba75"/>
      <circle cx="44" cy="16" r="7.5" fill="#f5ba75"/>
      <polygon points="28,-8 18,12 38,12" fill="#ffd15c"/>
      <circle cx="28,26" r="18" fill="#f5ba75"/>
      <ellipse cx="28,30" rx="8" ry="6" fill="#fff5ea"/>
      <circle cx="28,29" r="2" fill="#542e1d"/>
      <circle cx="21" cy="24" r="2.2" fill="#321b12"/>
      <circle cx="35" cy="24" r="2.2" fill="#321b12"/>
      <circle cx="16" cy="29" r="3.5" fill="#ff7b92" opacity="0.6"/>
      <circle cx="40" cy="29" r="3.5" fill="#ff7b92" opacity="0.6"/>
    </g>

    <!-- Bunny on Right -->
    <g transform="translate(56, 20)">
      <ellipse cx="14" cy="4" rx="5" ry="16" fill="#ffffff"/>
      <ellipse cx="14" cy="4" rx="3" ry="10" fill="#ffaec5"/>
      <ellipse cx="32" cy="4" rx="5" ry="16" fill="#ffffff"/>
      <ellipse cx="32" cy="4" rx="3" ry="10" fill="#ffaec5"/>
      <polygon points="23,-10 15,10 31,10" fill="#c3a2f7"/>
      <circle cx="23,28" r="16" fill="#ffffff"/>
      <polygon points="23,30 21,28 25,28" fill="#f585a2"/>
      <circle cx="17" cy="26" r="2" fill="#382129"/>
      <circle cx="29" cy="26" r="2" fill="#382129"/>
      <circle cx="13" cy="30" r="3.5" fill="#ff7b9a" opacity="0.6"/>
      <circle cx="33" cy="30" r="3.5" fill="#ff7b9a" opacity="0.6"/>
    </g>

    <!-- Carriage Basket Body (in front of them) -->
    <rect x="10" y="65" width="100" height="50" rx="8" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <line x1="10" y1="78" x2="110" y2="78" stroke="#b45309" stroke-width="2"/>
    <line x1="10" y1="92" x2="110" y2="92" stroke="#b45309" stroke-width="2"/>

    <!-- Paws resting over railing -->
    <ellipse cx="40" cy="65" rx="5" ry="4" fill="#f5ba75"/>
    <ellipse cx="52" cy="65" rx="5" ry="4" fill="#f5ba75"/>
    <ellipse cx="76" cy="65" rx="4.5" ry="4" fill="#ffffff"/>
    <ellipse cx="88" cy="65" rx="4.5" ry="4" fill="#ffffff"/>
  </g>
</svg>
